<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RELOADED Auction — Live</title>
<meta name="description" content="Watch The Game Up League RELOADED player auction live.">
<meta name="theme-color" content="#1a0a0c">
<link rel="icon" href="assets/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;700;800;900&family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;700;800;900&family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800&display=swap"></noscript>
<style>
:root{--navy:#1a0a0c;--gold:#ffc93c;--white:#f7f9ff;--muted:#c9b3ac;--line:rgba(255,255,255,.11);--font-ui:Archivo,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;--font-display:'Anton',var(--font-ui);--font-stat:'Barlow Condensed',var(--font-ui)}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-ui);background:linear-gradient(165deg,#220d10 0%,#3d1216 45%,#1a0a0c 100%);color:var(--white);min-height:100vh}
a{color:inherit;text-decoration:none}
.container{width:min(1100px,94%);margin:auto;padding:24px 0 60px}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;margin-bottom:6px}
.brand img{width:40px;height:46px;object-fit:contain}
.eyebrow{color:#2a1206;background:var(--gold);font-family:var(--font-stat);font-weight:700;letter-spacing:.5px;font-size:12px;text-transform:uppercase;display:inline-flex;align-items:center;padding:3px 10px 4px;border-radius:3px 3px 3px 0;margin-bottom:8px}
h1{font-family:var(--font-display);font-weight:400;font-style:italic;font-size:clamp(26px,5vw,38px);margin:4px 0 20px;letter-spacing:-.8px;text-transform:uppercase}
.liveDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6be3b3;margin-right:6px;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.blockCard{background:linear-gradient(145deg,rgba(255,201,60,.1),rgba(20,8,10,.95));border:2px solid var(--gold);border-radius:20px;padding:28px;text-align:center;margin-bottom:28px}
.blockCard .tag{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.blockCard .pname{font-family:var(--font-display);font-style:italic;font-size:clamp(28px,6vw,44px);margin:8px 0}
.blockCard .pbase{font-size:16px;color:var(--muted)}
.blockCard.idle{border-color:var(--line);background:rgba(42,14,18,.6)}
.teamsGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:28px}
.teamCard{background:rgba(42,14,18,.7);border:1px solid var(--line);border-radius:14px;padding:16px}
.teamCard .tname{font-weight:800;font-size:15px}
.teamCard .trow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}
.teamCard .trow b{color:var(--gold)}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.sectionTitle{font-family:var(--font-stat);font-weight:800;letter-spacing:.5px;text-transform:uppercase;font-size:14px;color:var(--gold);margin:28px 0 12px}
.tableWrap{background:rgba(42,14,18,.7);border:1px solid var(--line);border-radius:16px;overflow:auto;max-height:420px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:500px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--gold);font-size:11px;text-transform:uppercase;position:sticky;top:0;background:#1a0a0c}
.sub{color:var(--muted);font-size:13px}
.headerBar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.headerBar .brand img{width:52px;height:60px}
.mascot{width:76px;height:auto;filter:drop-shadow(0 10px 20px rgba(0,0,0,.4))}
.blockPhoto{width:150px;height:150px;border-radius:18px;object-fit:cover;border:3px solid var(--gold);margin:0 auto 14px;display:block;background:#2a0e12}
.leadBanner{margin-top:14px;padding:12px 16px;background:rgba(255,201,60,.15);border:2px solid var(--gold);border-radius:12px;font-size:22px;font-weight:900;color:#fff;animation:leadPulse .5s ease}
@keyframes leadPulse{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.soldOverlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(10,4,5,.88);backdrop-filter:blur(4px)}
.soldCard{text-align:center;animation:soldPop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes soldPop{0%{transform:scale(.4) rotate(-6deg);opacity:0}70%{transform:scale(1.08) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.soldCard .soldTag{font-family:var(--font-display);font-style:italic;font-size:clamp(50px,12vw,100px);color:#6be3b3;text-shadow:0 0 30px rgba(107,227,179,.6);letter-spacing:-2px}
.soldCard .soldName{font-size:clamp(22px,5vw,32px);font-weight:900;margin-top:6px}
.soldCard .soldInfo{font-size:18px;color:var(--gold);margin-top:8px;font-weight:800}
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:51;animation:confettiFall linear forwards}
@keyframes confettiFall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
</style>
</head>
<body>
<div class="container">
  <div class="headerBar">
    <div>
      <div class="brand"><img src="assets/gul-logo-hq.png" alt="The Game Up League"><span>THE GAME UP LEAGUE</span></div>
      <span class="eyebrow">RELOADED</span>
      <h1 style="margin-bottom:4px"><span class="liveDot"></span>Live Player Auction</h1>
    </div>
    <img class="mascot" src="assets/season2-mascot.jpg" alt="GUL RELOADED Mascot" style="border-radius:14px">
  </div>

  <div id="blockArea"></div>
  <div id="soldOverlayArea"></div>

  <div class="sectionTitle">Teams &amp; Purse Remaining</div>
  <div id="teamsGrid" class="teamsGrid"></div>

  <div class="sectionTitle">Recently Sold</div>
  <div class="tableWrap"><table>
    <thead><tr><th>Player</th><th>Team</th><th>Pool</th><th>Price</th></tr></thead>
    <tbody id="soldRows"></tbody>
  </table></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" defer></script>
<script src="admin/supabase-config.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  if (!window.GUL_SUPABASE_URL || window.GUL_SUPABASE_URL.includes('PASTE')) return;
  const client = supabase.createClient(window.GUL_SUPABASE_URL, window.GUL_SUPABASE_ANON_KEY);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = (n) => n == null ? '—' : '₹' + Number(n).toLocaleString('en-IN');
  let lastCelebratedSoldAt = null;

  function showSoldCelebration(playerName, teamName, price) {
    const area = document.getElementById('soldOverlayArea');
    const colors = ['#ffc93c', '#6be3b3', '#ff6a3d', '#f7f9ff', '#e3262e'];
    const confetti = Array.from({ length: 60 }, () => {
      const left = Math.random() * 100;
      const delay = Math.random() * 0.5;
      const duration = 2.2 + Math.random() * 1.6;
      const color = colors[Math.floor(Math.random() * colors.length)];
      return `<div class="confetti" style="left:${left}vw;background:${color};animation-duration:${duration}s;animation-delay:${delay}s"></div>`;
    }).join('');
    area.innerHTML = `<div class="soldOverlay">
      ${confetti}
      <div class="soldCard">
        <div class="soldTag">SOLD!</div>
        <div class="soldName">${esc(playerName || '')}</div>
        <div class="soldInfo">${esc(teamName || '')} · ${money(price)}</div>
      </div>
    </div>`;
    setTimeout(() => { area.innerHTML = ''; }, 4200);
  }

  async function tick() {
    const [{ data: teams }, { data: players }, { data: state }] = await Promise.all([
      client.from('auction_teams').select('*').order('team_name'),
      client.from('auction_players').select('*'),
      client.from('auction_state').select('*').eq('id', 1).maybeSingle()
    ]);
    if (!teams || !players) return;

    // On the block
    const blockEl = document.getElementById('blockArea');
    const current = state && state.current_block_player_id ? players.find(p => p.id === state.current_block_player_id) : null;
    if (current) {
      const leadingTeam = state.current_leading_team_id ? teams.find(t => t.id === state.current_leading_team_id) : null;
      const bidAmount = state.current_bid != null ? state.current_bid : current.base_price;
      const upcoming = players
        .filter(p => p.pool === current.pool && p.set_number === current.set_number && p.id !== current.id && (p.status === 'available' || p.status === 'recalled'))
        .slice(0, 3);
      blockEl.innerHTML = `<div class="blockCard">
        <div class="tag">${esc(current.pool)} · Set ${current.set_number}</div>
        ${current.photo_url ? `<img class="blockPhoto" src="${esc(current.photo_url)}" alt="${esc(current.full_name)}">` : ''}
        <div class="pname">${esc(current.full_name)}</div>
        <div class="pbase">${esc(current.position || 'Position not set')}${current.is_flexible ? ' · <span style="color:var(--gold)">Flexible</span>' : ''} · Base price: ${money(current.base_price)}</div>
        <div style="margin-top:16px;padding:14px;background:${leadingTeam ? 'rgba(255,201,60,.1)' : 'rgba(0,0,0,.25)'};border-radius:12px">
          <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Current Bid</div>
          <div style="font-family:var(--font-display);font-style:italic;font-size:36px;color:var(--gold)">${money(bidAmount)}</div>
          <div style="font-size:13px;color:var(--muted)">${leadingTeam ? '' : 'No bids yet'}</div>
        </div>
        ${leadingTeam ? `<div class="leadBanner">👑 ${esc(leadingTeam.team_name)}</div>` : ''}
        ${upcoming.length ? `<div style="margin-top:18px;text-align:left">
          <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Up Next</div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
            ${upcoming.map(p => `<div style="text-align:center;width:70px">
              ${p.photo_url ? `<img src="${esc(p.photo_url)}" style="width:54px;height:54px;border-radius:10px;object-fit:cover;border:1px solid var(--line)">` : ''}
              <div style="font-size:10.5px;margin-top:4px">${esc(p.full_name)}</div>
            </div>`).join('')}
          </div>
        </div>` : ''}
      </div>`;
    } else {
      blockEl.innerHTML = `<div class="blockCard idle"><div class="sub">⏳ No player on the block right now — check back shortly.</div></div>`;
    }

    // SOLD celebration - fires once per sale, shown for ~4.5s then clears itself
    const soldAt = state && state.last_sold_at ? new Date(state.last_sold_at).getTime() : null;
    if (soldAt && soldAt !== lastCelebratedSoldAt && Date.now() - soldAt < 10000) {
      lastCelebratedSoldAt = soldAt;
      showSoldCelebration(state.last_sold_player_name, state.last_sold_team_name, state.last_sold_price);
    }

    // Teams grid
    document.getElementById('teamsGrid').innerHTML = teams.map(t => {
      const pct = Math.max(0, Math.min(100, (t.remaining_purse / t.total_purse) * 100));
      return `<div class="teamCard">
        <div class="tname">${esc(t.team_name)}</div>
        <div class="trow"><span>Purse left</span><b>${money(t.remaining_purse)}</b></div>
        <div class="trow"><span>Squad</span><b>${t.squad_count}/${t.squad_target}</b></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
      </div>`;
    }).join('');

    // Recently sold
    const sold = players.filter(p => p.status === 'sold' || p.status === 'presigned').sort((a, b) => new Date(b.sold_at) - new Date(a.sold_at)).slice(0, 40);
    document.getElementById('soldRows').innerHTML = sold.map(p => {
      const team = teams.find(t => t.id === p.sold_to_team_id);
      return `<tr><td>${esc(p.full_name)}</td><td>${team ? esc(team.team_name) : '—'}</td><td>${esc(p.pool)}</td><td>${money(p.sold_price)}</td></tr>`;
    }).join('') || '<tr><td colspan="4" class="sub">No sales yet.</td></tr>';
  }

  tick();
  setInterval(tick, 4000);
});
</script>
</body>
</html>
